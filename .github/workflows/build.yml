name: build

# 只出 Windows 产物（便携版 exe + 安装包）。本项目不发布其它平台版本。
#
# 产物在 Actions 的 Artifacts 里下载，不自动发布到分发渠道 ——
# 发布仍走 tools/sync_oss.py + tools/push_github.py，避免 CI 拿到密钥。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 打包便携版 + 安装包
        run: |
          python tools/build.py
          python tools/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Windows系统管家.exe
            dist/Windows系统管家-v*-setup.exe
