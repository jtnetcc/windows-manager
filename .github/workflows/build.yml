name: build

# 只出 Windows 产物（便携版 exe + 安装包）。本项目不发布其它平台版本。
#
# 产物在 Actions 的 Artifacts 里下载，不自动发布到分发渠道 ——
# 发布仍走 tools/sync_oss.py + tools/push_github.py，避免 CI 拿到密钥。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install ruff

      - name: 静态检查
        run: |
          ruff check .
          python -m compileall -q core ui main.py tools installer

      - name: 自检（无桌面环境可跑的部分）
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          python tools/check_all.py --headless 2>&1 | tee check_all.log || {
            # 没有 token 时下载不到日志，把失败脚本名写成注解（公开仓库可匿名读取）
            detail=$(grep -A 8 '失败项' check_all.log | tr '\n' ' ' | cut -c1-600)
            echo "::error title=check_all 失败::${detail}"
            exit 1
          }

      - name: 上传自检日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-all-log
          path: check_all.log
          if-no-files-found: ignore

      - name: 打包便携版 + 安装包
        run: |
          python tools/build.py
          python tools/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Windows系统管家.exe
            dist/Windows系统管家-v*-setup.exe
