name: build

# 只出 Windows 产物（便携版 exe + 安装包）。本项目不发布其它平台版本。
#
# 两条产出路径：
# 1. Artifacts：每轮都传，90 天过期，用于排查；
# 2. GitHub Release：仅 tag 推送时创建（草稿 → 自检资产 → 公开），
#    这是「可交付」的正式入口。用内置 GITHUB_TOKEN，不需要额外密钥；
#    分发渠道（OSS）仍走 tools/sync_oss.py，密钥不进 CI。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Release 需要写权限；默认的 read 权限会让 gh release create 直接 403
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    # runner 默认控制台是 cp1252：任何 print 中文的脚本（自检、打包）都会崩，
    # 整轮统一 UTF-8，别指望单个步骤里补救
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install ruff

      - name: 静态检查
        run: |
          ruff check .
          python -m compileall -q core ui main.py tools installer

      - name: 自检（无桌面环境可跑的部分）
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          if python tools/check_all.py --headless > check_all.log 2>&1; then
            tail -n 25 check_all.log
          else
            tail -n 40 check_all.log
            # 公开仓库拿不到 Actions 日志：把失败行逐条写成注解，
            # 通过 check-runs API 可匿名读取，定位不必靠猜
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done < <(tail -n 12 check_all.log)
            {
              echo '### check_all 失败（最后 40 行）'
              echo '```'
              tail -n 40 check_all.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 上传自检日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-all-log
          path: check_all.log
          if-no-files-found: ignore

      - name: 版本守卫（tag 名必须等于 core/version.py）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import sys; sys.path.insert(0, '.'); from core.version import VERSION; print(VERSION)")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag 是 v$tag，但 core/version.py 是 $ver；发版前必须一致"
            exit 1
          fi
          echo "版本一致：v$ver"

      - name: 打包便携版 + 安装包
        run: |
          python tools/build.py
          python tools/build_installer.py

      - name: 生成校验清单
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Release 资产用纯 ASCII 名：Git Bash 把 UTF-8 中文名传给 gh 时会被
          # 按 ANSI 解释，实测 v0.0.64 第一版 assets 变成 "Windows.-v0.0.64.exe"。
          # 中文说明放到的 label 里，文件名保持可下载。
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -f "dist/Windows系统管家.exe" ]; then
            cp "dist/Windows系统管家.exe" "dist/WindowsManager-v${ver}.exe"
            cp "dist/Windows系统管家-v${ver}-setup.exe" "dist/WindowsManager-v${ver}-setup.exe"
          fi
          cd dist
          sha256sum WindowsManager-v*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 Release（草稿 → 校验 → 公开）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不用 set -e：gh 的报错要抓下来转成注解，否则无 token 时看不到日志
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # 任何一行非零退出都带行号与命令写进注解（无 token 时唯一可见的诊断）
          trap 'echo "::error::[release] 第 $LINENO 行失败：$BASH_COMMAND"' ERR
          ver="${GITHUB_REF_NAME#v}"
          echo "gh: $(gh --version | head -1)"
          gh auth status 2>&1 | sed 's/^/  /' || true
          python tools/release_notes.py --out release_notes.md

          # 同名 Release 已存在时先删，并且**验证删掉了**再创建。
          # v0.0.64 就是只写了 `|| true`：删除失败被吞掉，create 复用了旧
          # Release 里的旧资产（名字还是被截断的中文名），步骤却报成功。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false \
              || fail "旧 Release 删除失败，停止（避免复用旧资产）"
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              fail "旧 Release 仍存在，停止"
            fi
          fi

          # 一次性清理：v0.0.64 的 Release 是坏资产（名字截断、校验清单对不上），
          # 只允许在 v0.0.65 这轮删掉它；后续版本不受影响
          if [ "$ver" = "0.0.65" ] && gh release view v0.0.64 >/dev/null 2>&1; then
            gh release delete v0.0.64 --yes --cleanup-tag=false \
              || echo "::warning::v0.0.64 的坏 Release 删除失败，需手动处理"
          fi

          if ! gh release create "$GITHUB_REF_NAME" \
            "dist/WindowsManager-v${ver}.exe#便携版（单文件）" \
            "dist/WindowsManager-v${ver}-setup.exe#安装包" \
            "dist/SHA256SUMS.txt" \
            --draft --prerelease \
            --title "Windows系统管家 v${ver}（内测）" \
            --notes-file release_notes.md > release.log 2>&1; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::gh release create: ${line}"
            done < release.log
            exit 1
          fi

          # 公开前自检：资产数量、非空、草稿状态
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > release_check.json
          python tools/verify_release_assets.py release_check.json

          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "已公开：$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Windows系统管家.exe
            dist/WindowsManager-v*.exe
            dist/SHA256SUMS.txt
