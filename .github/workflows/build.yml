name: build

# 只出 Windows 产物（便携版 exe + 安装包）。本项目不发布其它平台版本。
#
# 产物在 Actions 的 Artifacts 里下载，不自动发布到分发渠道 ——
# 发布仍走 tools/sync_oss.py + tools/push_github.py，避免 CI 拿到密钥。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install ruff

      - name: 静态检查
        run: |
          ruff check .
          python -m compileall -q core ui main.py tools installer

      - name: 自检（无桌面环境可跑的部分）
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          if python tools/check_all.py --headless > check_all.log 2>&1; then
            tail -n 25 check_all.log
          else
            tail -n 40 check_all.log
            # 公开仓库拿不到 Actions 日志：把失败行逐条写成注解，
            # 通过 check-runs API 可匿名读取，定位不必靠猜
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done < <(tail -n 12 check_all.log)
            {
              echo '### check_all 失败（最后 40 行）'
              echo '```'
              tail -n 40 check_all.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 上传自检日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-all-log
          path: check_all.log
          if-no-files-found: ignore

      - name: 打包便携版 + 安装包
        run: |
          python tools/build.py
          python tools/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Windows系统管家.exe
            dist/Windows系统管家-v*-setup.exe
